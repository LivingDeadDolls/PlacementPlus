# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.0.0
group=io.github.livingdeaddolls
java_version=25

# Common
minecraft_version=26.2
mod_name=Placement Plus
mod_author=Yuhrp
mod_id=placementplus
license=MIT
credits=
description=Client-side block placement helpers: fast placement, flexible placement, placing against usable blocks without sneaking, and bridging. Works on vanilla servers.
